<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>CineFeel</title>

    <link rel="stylesheet" th:href="@{/css/index.css}">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap"
          rel="stylesheet">
</head>

<body>

<div class="container">

    <!-- navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- ================= HERO ================= -->
    <section class="hero-section">

        <div class="hero-overlay">

            <div class="hero-content">

                <div class="hero-mini-title">
                    ✦ AI MOVIE RECOMMENDATION
                </div>

                <div class="hero-sparkle">
                    ✦ ✦
                </div>

                <h1>
                    당신의 리뷰 감성을 분석해<br>
                    취향에 맞는 <span>영화를 추천해드려요</span>
                </h1>

                <div class="hero-line"></div>

                <p>
                    AI 감성 분석 기반 영화 추천 플랫폼 CineFeel
                </p>

                <div class="hero-buttons">

                    <!-- 로그인 상태 -->
                    <th:block th:if="${session.user != null}">

                        <a th:href="@{/movie/list}" class="btn-red">
                            리뷰 분석하기
                        </a>

                    </th:block>

                    <!-- 비로그인 -->
                    <th:block th:if="${session.user == null}">

                        <a th:href="@{/login}" class="btn-red">
                            로그인 후 시작하기
                        </a>

                    </th:block>

                    <a th:href="@{/movie/list}" class="btn-dark">
                        영화 둘러보기
                    </a>

                </div>

            </div>

        </div>

    </section>

    <!-- ================= 인기 영화 ================= -->
    <section class="movie-section">

        <div class="section-header">

            <div class="section-title">
                🔥 인기 영화 TOP 6
            </div>

            <a th:href="@{/movie/list}" class="more-link">
                전체보기 →
            </a>

        </div>

        <div class="movie-grid">

            <!-- 영화 반복 -->
            <div class="movie-card"
                 th:each="movie : ${movies}">

                <a th:href="@{/movie/detail/{id}(id=${movie.id})}">

                    <div class="movie-poster-wrap">

                        <img th:src="${movie.posterUrl}"
                             alt="영화 포스터">

                        <div class="movie-overlay">

                            <span>
                                상세보기
                            </span>

                        </div>

                    </div>

                    <div class="movie-info">

                        <h3 th:text="${movie.title}">
                            영화제목
                        </h3>

                        <div class="movie-meta">

                            <span class="movie-rating">
                                ⭐
                                <span th:text="${movie.rating}">
                                    4.5
                                </span>
                            </span>

                            <span class="movie-genre"
                                  th:text="${movie.genre}">
                                SF
                            </span>

                        </div>

                    </div>

                </a>

            </div>

        </div>

    </section>




    <!-- footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

</body>
</html>
