<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>CineFeel</title>

    <link rel="stylesheet" th:href="@{/css/index.css}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
          rel="stylesheet">
</head>

<body>

<div class="container">

    <!-- navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- hero -->
    <section class="hero-section">

        <div class="hero-overlay">

            <div class="hero-content">

                <h1>
                    당신의 리뷰 감성을 분석해<br>
                    취향에 맞는 영화를 추천해드려요
                </h1>

                <p>
                    리뷰 데이터를 기반으로 AI 영화 추천 서비스를 제공합니다.
                </p>

                <div class="hero-buttons">

                    <a href="#" class="btn-red">
                        리뷰 분석하기
                    </a>

                    <a href="/movie/list" class="btn-dark">
                        영화 둘러보기
                    </a>

                </div>

            </div>

        </div>

    </section>

    <!-- 인기 영화 -->
    <section class="movie-section">

        <div class="section-title">
            🔥 인기 영화 TOP 6
        </div>

        <div class="movie-grid">

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500/rAiYTfKGqDCRIIqo664sY9XZIvQ.jpg">
                <h3>인터스텔라</h3>
                <p>⭐ 4.8</p>
            </div>

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500/7IiTTgloJzvGI1TAYymCfbfl3vT.jpg">
                <h3>인셉션</h3>
                <p>⭐ 4.7</p>
            </div>

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg">
                <h3>다크나이트</h3>
                <p>⭐ 4.9</p>
            </div>

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500/uXDfjJbdP4ijW5hWSBrPrlKpxab.jpg">
                <h3>어벤져스</h3>
                <p>⭐ 4.6</p>
            </div>

        </div>

    </section>

    <!-- footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

</body>
</html>
