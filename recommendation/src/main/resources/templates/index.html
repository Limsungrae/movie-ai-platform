<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>CinePick</title>

    <link rel="stylesheet" th:href="@{/css/index.css}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body>

<div class="wrap">

    <!-- navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- hero -->
    <div class="hero">

        <div>

            <span class="date-pill">2026.05 기준</span>

            <h1>
                지금 극장에서<br>
                무엇을 볼까요?
            </h1>

            <p>
                사용자 리뷰와 평점을 기반으로
                당신에게 맞는 영화를 추천합니다.
            </p>

            <div class="cta-row">

                <a href="#recommend" class="btn btn-primary">
                    맞춤 추천 받기
                </a>

                <a href="#reviews" class="btn btn-ghost">
                    최신 리뷰 보기
                </a>

            </div>

        </div>

        <aside class="hero-card">

            <h3>인기 영화 TOP 5</h3>

            <ul class="trend-list">

                <li>슈퍼 마리오 갤럭시 무비</li>
                <li>악마는 프라다를 입는다 2</li>
                <li>살목지</li>

            </ul>

        </aside>

    </div>

    <!-- footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

</body>
</html>
