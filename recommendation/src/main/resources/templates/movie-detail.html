<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>영화 상세</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container py-5">

    <h1 th:text="${movie.title}"></h1>

    <p th:text="${movie.description}"></p>

    <hr>

    <h3>리뷰 작성</h3>

    <form th:action="@{/movies/{id}/review(id=${movie.id})}" method="post">

        <textarea name="content"
                  class="form-control mb-3"
                  rows="4"></textarea>

        <button class="btn btn-warning">
            리뷰 등록
        </button>

    </form>

    <hr>

    <h3>리뷰 목록</h3>

    <div th:each="review : ${reviews}" class="card bg-secondary mb-3">

        <div class="card-body">

            <h5 th:text="${review.user.username}"></h5>

            <p th:text="${review.content}"></p>

            <small>
                감정분석:
                <span th:text="${review.sentiment}"></span>
            </small>

        </div>

    </div>

</div>

</body>
</html>
