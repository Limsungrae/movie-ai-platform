<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>영화 목록</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

<div class="container mt-5">

    <h1 class="mb-4">🎬 영화 목록</h1>

    <div class="row">

        <div class="col-md-4 mb-4" th:each="movie : ${movies}">

            <div class="card bg-secondary text-light h-100">

                <img th:src="${movie.posterUrl}"
                     class="card-img-top"
                     style="height:500px; object-fit:cover;">

                <div class="card-body">

                    <h4 th:text="${movie.title}"></h4>

                    <p>
                        장르 :
                        <span th:text="${movie.genre}"></span>
                    </p>

                    <p>
                        감독 :
                        <span th:text="${movie.director}"></span>
                    </p>

                    <p>
                        ⭐ 평점 :
                        <span th:text="${movie.rating}"></span>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
