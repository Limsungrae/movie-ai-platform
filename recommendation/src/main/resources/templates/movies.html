<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>영화 목록 - CinePick</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" th:href="@{/css/index.css}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        .movies-page {
            padding-top: 3rem;
        }

        .movie-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: 0.2s;
            height: 100%;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            border-color: rgba(232, 184, 74, 0.3);
        }

        .movie-poster {
            width: 100%;
            height: 420px;
            object-fit: cover;
            background: #222;
        }

        .movie-content {
            padding: 1rem;
        }

        .movie-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .movie-meta {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 0.7rem;
        }

        .movie-description {
            color: #d6d6d6;
            font-size: 0.92rem;
            min-height: 70px;
        }

        .rating {
            color: var(--accent);
            font-weight: 700;
            margin-top: 1rem;
        }

    </style>
</head>

<body>

<div class="wrap">

    <!-- 공통 navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="movies-page">

        <div class="d-flex justify-content-between align-items-center mb-5">

            <div>
                <h1 class="fw-bold">🎬 영화 목록</h1>
                <p class="text-secondary mb-0">
                    CinePick 추천 영화 리스트
                </p>
            </div>

        </div>

        <div class="row g-4">

            <div class="col-lg-4 col-md-6"
                 th:each="movie : ${movies}">

                <div class="movie-card">

                    <!-- 포스터 -->
                    <img th:src="${movie.posterUrl}"
                         alt="영화 포스터"
                         class="movie-poster">

                    <div class="movie-content">

                        <!-- 제목 -->
                        <div class="movie-title"
                             th:text="${movie.title}">
                        </div>

                        <!-- 감독 / 장르 -->
                        <div class="movie-meta">

                            감독 :
                            <span th:text="${movie.director}"></span>

                            <br>

                            장르 :
                            <span th:text="${movie.genre}"></span>

                        </div>

                        <!-- 줄거리 -->
                        <div class="movie-description"
                             th:text="${movie.description}">
                        </div>

                        <!-- 평점 -->
                        <div class="rating">

                            ⭐ 평점 :
                            <span th:text="${movie.rating}"></span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- 공통 footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

</body>
</html>
