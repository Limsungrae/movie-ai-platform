<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>
        분석 결과 - CineFeel
    </title>

    <!-- CSS -->
    <link rel="stylesheet"
          th:href="@{/css/sentiment-result.css}">

    <!-- 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap"
          rel="stylesheet">
</head>

<body>

<div class="result-page">

    <!-- navbar -->

    <main class="result-container">

        <!-- ================= TITLE ================= -->
        <div class="result-title-wrap">

            <div class="mini-brand">
                ✦ CINEFEEL
            </div>

            <h1>
                분석 결과 <span>& 추천 영화</span>
            </h1>

        </div>

        <!-- ================= RESULT CARD ================= -->
        <section class="result-card">

            <h2>
                당신의 리뷰 분석 결과
            </h2>

            <div class="result-summary">

                <!-- ================= 감정 분석 ================= -->
                <div class="sentiment-box">

                    <!-- 이모지 -->
                    <div class="face"
                         th:classappend="${result.sentiment == 'POSITIVE'} ? 'positive-face' : 'negative-face'"
                         th:text="${result.sentiment == 'POSITIVE'} ? '😊' : '😢'">
                    </div>

                    <!-- 감정 정보 -->
                    <div class="sentiment-info">

                        <h3 th:classappend="${result.sentiment == 'POSITIVE'} ? 'positive-text' : 'negative-text'"
                            th:text="${result.sentiment == 'POSITIVE'} ? '긍정 리뷰' : '부정 리뷰'">

                            긍정 리뷰

                        </h3>

                        <p>
                            긍정 확률
                        </p>

                        <strong>

                            <span th:text="${result.positivePercent}">
                                87
                            </span>%

                        </strong>

                    </div>

                    <!-- progress -->
                    <div class="progress">

                        <div class="progress-fill"
                             th:style="'width:' + ${result.positivePercent} + '%'">
                        </div>

                    </div>

                    <!-- 비율 -->
                    <div class="ratio-row">

                        <span class="positive">

                            ● 긍정
                            <span th:text="${result.positivePercent}">
                                87
                            </span>%

                        </span>

                        <span class="negative">

                            ● 부정
                            <span th:text="${result.negativePercent}">
                                13
                            </span>%

                        </span>

                    </div>

                </div>

                <!-- ================= 분석 기준 ================= -->
                <div class="standard-box">

                    <h3>
                        분석 기준
                    </h3>

                    <div class="standard-row">

                        <span>
                            리뷰 감성
                        </span>

                        <strong th:text="${result.sentiment}">
                            POSITIVE
                        </strong>

                    </div>

                    <div class="standard-row">

                        <span>
                            긍정 비율
                        </span>

                        <strong>

                            <span th:text="${result.positivePercent}">
                                87
                            </span>%

                        </strong>

                    </div>

                    <div class="standard-row">

                        <span>
                            부정 비율
                        </span>

                        <strong>

                            <span th:text="${result.negativePercent}">
                                13
                            </span>%

                        </strong>

                    </div>

                    <div class="standard-row">

                        <span>
                            추천 기준
                        </span>

                        <strong>
                            유사 감정 영화 추천
                        </strong>

                    </div>

                    <!-- 여기 review.predictedRating 쓰면 오류날 수 있음 -->
                    <div class="standard-row">

                        <span>
                            AI 예상 평점
                        </span>

                        <strong>

                            ⭐

                            <span th:text="${#numbers.formatDecimal(result.predictedRating,1,1)}">
                                4.5
                            </span>

                        </strong>

                    </div>

                </div>

            </div>

            <!-- ================= 추천 영화 ================= -->
            <div class="recommend-section">

                <h2>
                    감성 분석 기반 추천 영화
                </h2>

                <p>
                    AI가 리뷰 감정을 기반으로 추천한 영화입니다.
                </p>

                <!-- 추천 없을 때 -->
                <div th:if="${#lists.isEmpty(result.recommendations)}">

                    <p style="color:#999;">
                        추천 영화가 없습니다.
                    </p>

                </div>

                <!-- 추천 목록 -->
                <div class="recommend-grid">

                    <a class="recommend-card"
                       th:each="movie : ${result.recommendations}"
                       th:href="@{/movie/detail/{id}(id=${movie.movieId})}">

                        <!-- 포스터 -->
                        <img th:src="${movie.posterUrl != null ? movie.posterUrl : '/images/no-image.png'}"
                             alt="추천 영화 포스터">

                        <!-- 정보 -->
                        <div class="recommend-info">

                            <h3 th:text="${movie.title}">
                                영화 제목
                            </h3>

                            <div class="recommend-rating">

                                ⭐
                                <span th:text="${#numbers.formatDecimal(movie.rating,1,1)}">
                                    4.5
                                </span>

                            </div>

                            <div class="recommend-match">

                                🔥 매칭률
                                <span th:text="${#numbers.formatDecimal(movie.matchScore,1,1)}">
                                    88.0
                                </span>%

                            </div>

                        </div>

                    </a>

                </div>

            </div>

        </section>

    </main>

</div>

</body>
</html>
