<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header class="navbar" th:fragment="navbar">

    <div class="nav-left">

        <a href="/" class="logo">
            Cine<span>Feel</span>
        </a>

        <div class="nav-menu">
            <a href="#recommend">추천</a>
            <a href="#reviews">리뷰</a>
            <a href="/mypage">마이페이지</a>
            <a href="/movie/list">영화목록</a>
        </div>

    </div>

    <div class="nav-right">

        <input type="text"
               class="search-input"
               placeholder="영화를 검색하세요">

        <!-- 로그인 안한 상태 -->
        <div class="auth-menu" th:if="${session.user == null}">
            <a href="/login">로그인</a>
            <a href="/signup">회원가입</a>
        </div>

        <!-- 로그인 한 상태 -->
        <div class="auth-menu" th:if="${session.user != null}">
            <span th:text="${session.user.username} + '님'"></span>
            <a href="/logout">로그아웃</a>
        </div>

    </div>

</header>

</body>
</html>
