<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">

    <title th:text="${movie.title} + ' - CineFeel'">
        영화 상세
    </title>

    <!-- CSS -->
    <link rel="stylesheet"
          th:href="@{/css/movie-detail.css}">

    <!-- 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap"
          rel="stylesheet">
</head>

<body>

<div class="detail-page">

    <!-- navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>


    <!-- ================= DETAIL CARD ================= -->
    <main class="detail-card">

        <!-- ===== LEFT : POSTER ===== -->
        <section class="poster-area">

            <div class="main-poster">

                <!-- 포스터 -->
                <img th:if="${movie.posterUrl != null}"
                     th:src="${movie.posterUrl}"
                     alt="movie poster">

                <!-- 포스터 없을 때 -->
                <div th:if="${movie.posterUrl == null}"
                     class="poster-placeholder">

                    NO IMAGE

                </div>

            </div>

        </section>

        <!-- ===== RIGHT : INFO ===== -->
        <section class="info-area">

            <!-- 제목 -->
            <h1 th:text="${movie.title}">
                영화 제목
            </h1>

            <!-- 평점 -->
            <div class="rating">

                <span class="star">
                    ★
                </span>

                <strong th:text="${movie.rating} ?: 0">
                    0.0
                </strong>

                <span>
                    평점
                </span>

            </div>

            <!-- 장르 -->
            <div class="tag-list">

                <span th:text="${movie.genre}">
                    SF
                </span>

            </div>

            <!-- 감독 / 개봉 -->
            <div class="movie-info">

                <p>

                    <strong>
                        감독
                    </strong>

                    <span th:text="${movie.director} ?: '정보 없음'">
                    </span>

                </p>

                <p>

                    <strong>
                        개봉
                    </strong>

                    <span th:text="${movie.releaseDate} ?: '-'">
                    </span>

                </p>

            </div>

            <!-- 설명 -->
            <p class="description"
               th:text="${movie.description} ?: '설명이 없습니다.'">

                영화 설명

            </p>

            <!-- 리뷰 버튼 -->
            <div class="review-btn-area">

                <a th:href="@{/movie/review/{id}(id=${movie.id})}"
                   class="main-btn"
                   style="
                   display:flex;
                   align-items:center;
                   justify-content:center;
                   text-decoration:none;">

                    리뷰 작성하기

                </a>

            </div>

        </section>

    </main>

    <!-- ================= REVIEW SECTION ================= -->
    <section class="review-section">

        <!-- 타이틀 -->
        <div class="review-title-wrap"
             style="
             display:flex;
             justify-content:space-between;
             align-items:center;
             margin-bottom:20px;">

            <h2>
                리뷰 목록
            </h2>

            <span style="color:#9ca3af; font-size:14px;"
                  th:text="${#lists.size(reviews)} + '개의 리뷰'">

                0개의 리뷰

            </span>

        </div>

        <!-- 리뷰 없을 때 -->
        <div th:if="${#lists.isEmpty(reviews)}"
             class="empty-review">

            <p style="color:#9ca3af;">
                아직 작성된 리뷰가 없습니다.
            </p>

        </div>

        <!-- 리뷰 반복 -->
        <div class="review-card"
             th:each="review : ${reviews}">

            <!-- 상단 -->
            <div class="review-header">

                <!-- 작성자 -->
                <strong th:text="${review.user != null ? review.user.username : '익명'}">
                    user
                </strong>

                <!-- 감정 -->
                <span class="sentiment"

                      th:text="${review.sentiment == 'POSITIVE'}
                               ? '긍정'
                               : '부정'"

                      th:style="${review.sentiment == 'POSITIVE'}
                      ? 'background:rgba(34,197,94,0.12); color:#22c55e;'
                      : 'background:rgba(239,68,68,0.12); color:#ef4444;'">

                    긍정

                </span>

            </div>

            <!-- 내용 -->
            <p th:text="${review.content}">
                리뷰 내용
            </p>

        </div>

    </section>

</div>

</body>
</html>
