<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title th:text="${movie.title} + ' - CineFeel'">
        영화 상세
    </title>

    <!-- CSS -->
    <link rel="stylesheet"
          th:href="@{/css/movie-detail.css}">

    <!-- 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap"
          rel="stylesheet">
</head>

<body>

<div class="detail-page">

    <!-- ================= TOPBAR ================= -->
    <header class="navbar">

        <!-- 로고 -->
        <a class="logo"
           th:href="@{/}">
            CineFeel
        </a>

        <!-- 메뉴 -->
        <nav>

            <a th:href="@{/}">
                홈
            </a>

            <a th:href="@{/movie/list}">
                영화목록
            </a>

            <!-- 로그인 상태 -->
            <a sec:authorize="isAuthenticated()"
               th:href="@{/mypage}">
                마이페이지
            </a>

        </nav>

        <!-- 우측 -->
        <div class="nav-icons">

            <!-- 비로그인 -->
            <th:block sec:authorize="isAnonymous()">

                <a th:href="@{/login}">
                    로그인
                </a>

                <a th:href="@{/signup}">
                    회원가입
                </a>

            </th:block>

            <!-- 로그인 -->
            <th:block sec:authorize="isAuthenticated()">

                <span class="user-badge">

                    👤
                    <span sec:authentication="name"></span>

                </span>

                <a th:href="@{/logout}">
                    로그아웃
                </a>

            </th:block>

        </div>

    </header>

    <!-- ================= DETAIL ================= -->
    <main class="detail-card">

        <!-- ===== POSTER ===== -->
        <section class="poster-area">

            <div class="main-poster">

                <!-- 포스터 -->
                <img th:if="${movie.posterUrl != null}"
                     th:src="${movie.posterUrl}"
                     alt="movie poster">

                <!-- 포스터 없을 때 -->
                <div th:if="${movie.posterUrl == null}"
                     class="poster-placeholder">

                    NO IMAGE

                </div>

            </div>

        </section>

        <!-- ===== INFO ===== -->
        <section class="info-area">

            <!-- 제목 -->
            <h1 th:text="${movie.title}">
                영화 제목
            </h1>

            <!-- 평점 -->
            <div class="rating">

                <span class="star">
                    ★
                </span>

                <strong th:text="${#numbers.formatDecimal(movie.rating,1,1)} ?: 0">
                    0.0
                </strong>

                <span>
                    평점
                </span>

            </div>

            <!-- 장르 -->
            <div class="tag-list">

                <span th:text="${movie.genre}">
                    SF
                </span>

            </div>

            <!-- 감독 / 개봉 -->
            <div class="movie-info">

                <p>

                    <strong>
                        감독
                    </strong>

                    <span th:text="${movie.director} ?: '정보 없음'">
                    </span>

                </p>

                <p>

                    <strong>
                        개봉
                    </strong>

                    <span th:text="${movie.releaseDate} ?: '-'">
                    </span>

                </p>

            </div>

            <!-- 설명 -->
            <p class="description"
               th:text="${movie.description} ?: '설명이 없습니다.'">

                영화 설명

            </p>

            <!-- 버튼 -->
            <div class="review-btn-area">

                <!-- 로그인 상태 -->
                <a sec:authorize="isAuthenticated()"
                   th:href="@{/movie/review/{id}(id=${movie.id})}"
                   class="write-review-btn">

                    리뷰 작성하기

                </a>

                <!-- 비로그인 -->
                <a sec:authorize="isAnonymous()"
                   th:href="@{/login}"
                   class="write-review-btn">

                    로그인 후 리뷰 작성

                </a>

            </div>

        </section>

    </main>

    <!-- ================= REVIEW SECTION ================= -->
    <section class="review-section">

        <div class="review-title-wrap">

            <h2>
                리뷰 목록
            </h2>

            <span th:text="${#lists.size(reviews)} + '개의 리뷰'">
                0개의 리뷰
            </span>

        </div>

        <!-- 리뷰 없을 때 -->
        <div th:if="${#lists.isEmpty(reviews)}"
             class="empty-review">

            <p>
                아직 작성된 리뷰가 없습니다.
            </p>

        </div>

        <!-- 리뷰 반복 -->
        <div class="review-card"
             th:each="review : ${reviews}">

            <!-- 상단 -->
            <div class="review-header">

                <!-- 작성자 -->
                <strong th:text="${review.user != null ? review.user.username : '익명'}">
                    user
                </strong>

                <!-- 감정 -->
                <span class="sentiment"
                      th:text="${review.sentiment == 'POSITIVE'} ? '긍정' : '부정'"
                      th:classappend="${review.sentiment == 'POSITIVE'} ? 'positive' : 'negative'">

                    긍정

                </span>

            </div>

            <!-- 내용 -->
            <p th:text="${review.content}">
                리뷰 내용
            </p>

            <!-- AI 평점 -->
            <div class="review-rating">

                ⭐ AI 예상 평점

                <strong th:text="${#numbers.formatDecimal(review.predictedRating,1,1)}">
                    4.5
                </strong>

            </div>

        </div>

    </section>

</div>

</body>
</html>
