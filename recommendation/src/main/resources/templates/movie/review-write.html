<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>리뷰 작성 - CineFeel</title>

    <link rel="stylesheet"
          th:href="@{/css/review-write.css}">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap"
          rel="stylesheet">
</head>

<body>

<!-- ================= TOPBAR ================= -->
<header class="topbar">

    <!-- 로고 -->
    <a th:href="@{/}" class="logo">
        CineFeel
    </a>

    <!-- 메뉴 -->
    <nav class="nav-menu">

        <a th:href="@{/}">
            홈
        </a>

        <a th:href="@{/movie/list}">
            영화목록
        </a>

    </nav>

    <!-- ================= AUTH ================= -->
    <div class="top-right">

        <!-- 비로그인 -->
        <div sec:authorize="isAnonymous()">

            <a th:href="@{/login}">
                로그인
            </a>

            <a th:href="@{/signup}">
                회원가입
            </a>

        </div>

        <!-- 로그인 -->
        <div sec:authorize="isAuthenticated()">

            <span>
                👤
                <span th:text="${#authentication.name}">
                    USER
                </span>
            </span>

            <a th:href="@{/logout}">
                로그아웃
            </a>

        </div>

    </div>

</header>

<!-- ================= CONTENT ================= -->
<div class="review-container">

    <div class="review-card">

        <!-- 영화 정보 -->
        <div class="movie-info">

            <img th:src="${movie.posterUrl}" alt="영화 포스터">

            <div class="movie-text">

                <h2 th:text="${movie.title}">
                    영화 제목
                </h2>

                <p>
                    <span th:text="${movie.genre}">SF</span>
                    /
                    <span th:text="${movie.releaseDate}">2024</span>
                </p>

                <div class="movie-rating">
                    ⭐ <span th:text="${movie.rating}">4.8</span>
                </div>

            </div>

        </div>

        <div class="divider"></div>

        <h3 class="review-title">
            리뷰를 작성해주세요
        </h3>

        <p class="review-sub">
            이 영화는 어떤 느낌이었나요?
        </p>

        <!-- 리뷰 폼 -->
        <form th:action="@{/movie/review/{id}(id=${movie.id})}"
              method="post">

            <div class="review-box">

                <textarea name="content"
                          maxlength="500"
                          required
                          placeholder="영화를 보고 느낀 감정을 자유롭게 작성해주세요."></textarea>

            </div>

            <p class="notice">
                ⓘ 욕설, 비방, 스포일러는 제한될 수 있어요.
            </p>

            <button type="submit"
                    class="analyze-btn">

                감성 분석하기

            </button>

        </form>

    </div>

</div>

</body>
</html>
